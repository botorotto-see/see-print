<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>刷る位置を決める｜EDITION SEE?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;
  --gray:#767677;
  --line:#E3E3E3;
  --font:"Archivo","Helvetica Neue",Arial,"Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--black);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px}
.top .wm{font-weight:700;font-size:16px;text-transform:uppercase}
.top .info{font-size:11px;letter-spacing:.06em;color:var(--gray)}
.rules{height:0;border-top:1px solid var(--black);position:relative}
.rules::before,.rules::after{content:"";position:absolute;left:0;right:0;border-top:1px solid var(--black)}
.rules::before{top:3px}
.rules::after{top:6px}

.wrap{max-width:1180px;margin:0 auto;padding:34px 24px 0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:44px;align-items:start}

.tile{position:relative;background:#DEDBD8}
.tile svg{display:block;width:100%;height:auto;touch-action:none}
.tag{position:absolute;top:14px;left:14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}
#logo{cursor:grab;mix-blend-mode:multiply}
#logo:active{cursor:grabbing}
#logo:focus-visible{outline:2px solid var(--black);outline-offset:4px}

.meas{display:flex;flex-wrap:wrap;gap:2px 26px;margin-top:14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.meas b{color:var(--black);font-weight:600;letter-spacing:.04em}

.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);margin:0 0 6px}
h1{margin:0;font-size:30px;line-height:1.15;font-weight:700}
.lede{margin:10px 0 0;font-size:13px;color:var(--gray)}

.set{border-top:1px solid var(--line);margin-top:28px;padding-top:16px}
.set h2{margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.set h2 span{float:right;font-weight:600;letter-spacing:.02em;font-size:13px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--black)}
input[type=range]::-moz-range-track{height:1px;background:var(--black)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--black);margin-top:-8px;border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--black);border:0;border-radius:0}
input[type=range]:focus-visible{outline:2px solid var(--black);outline-offset:6px}
.ends{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;letter-spacing:.1em;color:var(--gray)}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{appearance:none;background:#fff;border:1px solid var(--line);color:var(--black);
  font:inherit;font-size:13px;padding:11px 16px;min-width:56px;cursor:pointer}
.opt:hover{border-color:var(--black)}
.opt[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:#fff}

.hint{margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--gray)}

footer{border-top:1px solid var(--line);margin-top:56px;padding:24px}
footer .in{max-width:1180px;margin:0 auto;font-size:11.5px;color:var(--gray);line-height:2}
footer b{color:var(--black);font-weight:600}

@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:26px;padding-top:22px}
  h1{font-size:24px}
}

/* スマホ：操作の幅を画面いっぱいに近づける */
@media (max-width:600px){
  .top{padding:12px 16px}
  .top .info{font-size:10px}
  .wrap{padding:18px 16px 0;gap:20px}
  footer{padding:20px 16px;margin-top:40px}
  .set{margin-top:22px}
  .meas{gap:2px 18px;margin-top:12px}
  .opt{padding:13px 14px;font-size:14px}
  input[type=range]{height:44px}
  input[type=range]::-webkit-slider-runnable-track{height:2px}
  input[type=range]::-moz-range-track{height:2px}
  input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-13px}
  input[type=range]::-moz-range-thumb{width:26px;height:26px}
  .ends{margin-top:2px}
}
</style>
</head>

  <aside>
    <p class="eyebrow">EDITION SEE?</p>
    <h1>刷る位置を決める</h1>
    <p class="lede">ロゴを指で動かして、刷る場所と大きさを決めます。</p>

    <div class="set">
      <h2>アイテム</h2>
      <div class="opts" id="items"></div>
    </div>

    <div class="set">
      <h2>大きさ<span id="wval"></span></h2>
      <input type="range" id="size" min="5" max="48" step="0.5" value="16" aria-label="ロゴの幅">
      <div class="ends"><span>5cm</span><span id="maxlab"></span></div>
    </div>

    <div class="set">
      <h2>位置</h2>
      <div class="opts" id="spots"></div>
    </div>

    <p class="hint">インクは1デザインにつき1色です。決まったら、この画面を店で見せてください。</p>
  </aside>
</main>

<footer>

  </div>
</footer>

const LOGO = { w: 1528, h: 463 };
const VB = { w:1000, h:902 };

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const it = () => ITEMS[state.item];
const upc = () => it().bodyPx / it().widthCm;
const maxCm = () => { const a = it().area, u = upc();
  return Math.min(a.w/u, (a.h/u)/(LOGO.h/LOGO.w)); };

const state = { item:'tee', wCm:16, cx:500, cy:300 };

function render(){
  const s = it(), u = upc(), a = s.area, mx = maxCm();

  $('#tag').textContent = s.tag;
  $('#photo').setAttribute('href', s.photo);

  state.wCm = clamp(state.wCm, 5, mx);
  const w = state.wCm * u, h = w * LOGO.h / LOGO.w;
  state.cx = clamp(state.cx, a.x + w/2, a.x + a.w - w/2);
  state.cy = clamp(state.cy, a.y + h/2, a.y + a.h - h/2);
  $('#logo').setAttribute('transform',
    'translate('+(state.cx-w/2).toFixed(2)+','+(state.cy-h/2).toFixed(2)+') scale('+(w/LOGO.w).toFixed(5)+')');

  const hCm = state.wCm * LOGO.h / LOGO.w;
  const top = ((state.cy - h/2) - s.ref.y) / u;
  const off = (state.cx - s.centerX) / u;
  const dir = Math.abs(off) < 0.15 ? 'まん中' : (off>0 ? '右へ '+off.toFixed(1)+'cm' : '左へ '+Math.abs(off).toFixed(1)+'cm');
  $('#meas').innerHTML =
    '<span>大きさ <b>'+state.wCm.toFixed(1)+' × '+hCm.toFixed(1)+'cm</b></span>'+
    '<span>'+s.ref.label+' <b>'+top.toFixed(1)+'cm</b></span>'+
    '<span>中心から <b>'+dir+'</b></span>';

  const sz = $('#size');
  sz.max = mx.toFixed(1); sz.value = state.wCm;
  $('#wval').textContent = state.wCm.toFixed(1)+'cm';
  $('#maxlab').textContent = mx.toFixed(0)+'cm（全面）';

  const items = $('#items'); items.innerHTML = '';
  Object.keys(ITEMS).forEach(k => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = ITEMS[k].label;
    b.setAttribute('aria-pressed', k === state.item);
    b.onclick = () => { state.item = k; const p = ITEMS[k].spots[0];
      state.wCm = p.w; state.cx = p.cx; state.cy = p.cy; render(); };
    items.appendChild(b);
  });

  const spots = $('#spots'); spots.innerHTML = '';
  s.spots.forEach(p => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = p.n;
    b.setAttribute('aria-pressed', Math.abs(state.cx-p.cx)<0.6 && Math.abs(state.cy-p.cy)<0.6);
    b.onclick = () => { state.wCm = Math.min(p.w, mx); state.cx = p.cx; state.cy = p.cy; render(); };
    spots.appendChild(b);
  });
}

/* 動かす */
const svg = $('#svg'), logo = $('#logo');
let drag = null;
const toPx = e => { const r = svg.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*VB.w, y:(e.clientY-r.top)/r.height*VB.h }; };
logo.addEventListener('pointerdown', e => {
  const p = toPx(e); drag = { dx:state.cx-p.x, dy:state.cy-p.y };
  logo.setPointerCapture(e.pointerId); e.preventDefault();
});
logo.addEventListener('pointermove', e => {
  if(!drag) return; const p = toPx(e);
  state.cx = p.x+drag.dx; state.cy = p.y+drag.dy; render();
});
logo.addEventListener('pointerup', () => drag = null);
logo.addEventListener('pointercancel', () => drag = null);
logo.addEventListener('keydown', e => {
  const d = upc() * (e.shiftKey ? 1 : 0.2);
  const m = { ArrowLeft:[-d,0], ArrowRight:[d,0], ArrowUp:[0,-d], ArrowDown:[0,d] }[e.key];
  if(!m) return; state.cx += m[0]; state.cy += m[1]; render(); e.preventDefault();
});
$('#size').addEventListener('input', e => { state.wCm = parseFloat(e.target.value); render(); });

render();
</script>
